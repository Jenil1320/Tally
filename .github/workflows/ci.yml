name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # 1. Privacy gate. Run first so we fail fast if anyone adds telemetry.
  # ---------------------------------------------------------------------------
  no-telemetry:
    name: Forbidden dep gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve dependency tree
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > deps.txt

      - name: Fail if a telemetry SDK is present
        run: |
          set -e
          PATTERN='firebase-analytics|amplitude|mixpanel|bugsnag|sentry-android|datadog|appsflyer|com\.flurry|com\.crashlytics'
          if grep -E -i "$PATTERN" deps.txt; then
            echo ""
            echo "::error::A forbidden telemetry/analytics SDK appeared in the dependency tree."
            echo "Tally is local-first and ships no telemetry. See docs/PRIVACY.md."
            exit 1
          fi
          echo "::notice::Privacy gate passed — no telemetry SDKs in the tree."

  # ---------------------------------------------------------------------------
  # 2. Static analysis: ktlint + detekt.
  # ---------------------------------------------------------------------------
  lint:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    needs: no-telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: detekt
        run: ./gradlew detekt

  # ---------------------------------------------------------------------------
  # 3. Unit tests (JUnit5 + Turbine + Kotest + Paparazzi screenshot diff).
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: no-telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      # Paparazzi screenshot goldens are recorded on the developer's machine
      # (Windows). Cross-OS font rasterisation differs, so they are excluded on
      # this Linux runner until re-recorded on Linux. They still run locally.
      # See app/build.gradle.kts and docs/DECISIONS/0004.
      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest -PexcludeScreenshotTests

  # ---------------------------------------------------------------------------
  # 4. APK build — the actual installable artefact.
  # ---------------------------------------------------------------------------
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - name: Fetch Geist fonts
        run: bash scripts/fetch-geist-fonts.sh
      - name: assembleDebug
        run: ./gradlew :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tally-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
