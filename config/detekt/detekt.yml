build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 18
  TooManyFunctions:
    active: false  # Compose UI files legitimately have many small composables.

style:
  active: true
  MagicNumber:
    active: false  # ViewModel maths uses constants meaningful in context.
  WildcardImport:
    active: true
  UnusedImports:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Resolve before merge.'
        value: 'FIXME'
      - reason: 'Never ship a STOPSHIP.'
        value: 'STOPSHIP'
  # Tally constitution (N9): no analytics SDKs. This backstops the CI
  # dependency-tree grep at the source level — a forbidden import fails detekt.
  ForbiddenImport:
    active: true
    imports:
      - value: 'com.google.firebase.analytics.**'
        reason: 'No analytics SDKs — Tally is local-first (N9).'
      - value: 'com.amplitude.**'
        reason: 'No analytics SDKs (N9).'
      - value: 'com.mixpanel.**'
        reason: 'No analytics SDKs (N9).'
      - value: 'com.bugsnag.**'
        reason: 'No crash/telemetry SDKs (N9).'
      - value: 'io.sentry.**'
        reason: 'No crash/telemetry SDKs (N9).'
      - value: 'com.datadog.**'
        reason: 'No telemetry SDKs (N9).'
      - value: 'com.appsflyer.**'
        reason: 'No attribution/telemetry SDKs (N9).'

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable', 'Test']  # Composables PascalCase, tests use backticks.

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
